name: Wery Morph Blockbench Windows

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable executable
        run: npm run build-test-portable

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Blockbench-Wery-Morph-Windows
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14
